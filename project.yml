name: TheMargin
options:
  bundleIdPrefix: com.cambriadavies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7A64CA34R2
    CODE_SIGN_STYLE: Automatic

targets:
  TheMargin:
    type: application
    platform: iOS
    sources:
      - path: TheMarginApp.swift
      - path: ContentView.swift
      - path: Models
      - path: Views
      - path: Services
      - path: Theme
      - path: Components
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Audio
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/writing-tips.json
        buildPhase: resources
        optional: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fonts/SpecialElite-Regular.ttf
          - Fonts/Fraunces-Variable.ttf
          - Fonts/Fraunces-Italic-Variable.ttf
          - Fonts/SpaceGrotesk-Variable.ttf
          - Fonts/SpaceMono-Regular.ttf
          - Fonts/SpaceMono-Bold.ttf

  TheMarginTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: TheMarginTests
    dependencies:
      - target: TheMargin
