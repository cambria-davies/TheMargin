<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,600&family=Literata:opsz,wght@7..72,300;7..72,400;7..72,500&family=JetBrains+Mono:wght@300;400&display=swap');

  :root {
    --bg: #1A1A18;
    --surface: #242422;
    --text: #E8DFD0;
    --text-dim: #908880;
    --text-faint: #605850;
    --amber: #C4956A;
    --paper: #F5F0E8;
    --ink-black: #2A2218;
    --ink-light: #6A5E50;
  }

  body { background: var(--bg) !important; color: var(--text); font-family: 'Literata', serif; }
  h2 { font-family: 'Newsreader', serif; font-weight: 300; color: var(--text); margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
  .section-label {
    font-family: 'Literata', serif; font-size: 10px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--text-faint); margin-bottom: 16px; margin-top: 40px;
  }

  .compare {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    margin-bottom: 40px;
  }

  .compare-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .compare-item .label {
    font-family: 'Literata', serif;
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .nib-large {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #7A5C50;
  }

  .nib-large svg { width: 42px; height: 42px; }

  .arrow { color: var(--text-faint); font-size: 24px; margin-top: 30px; }

  /* Sizes row */
  .sizes-row {
    display: flex;
    gap: 28px;
    justify-content: center;
    align-items: flex-end;
    margin: 20px 0 40px;
  }

  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .size-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-faint);
  }

  .sel-dot {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #7A5C50;
  }

  /* Full set */
  .full-selector {
    background: var(--surface);
    border-radius: 12px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.04);
    margin-top: 20px;
  }

  .full-selector h3 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 24px;
    text-align: center;
  }

  .sel-strip {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .sel-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .sel-dot-mood {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--text-faint);
  }

  .sel-dot-mood.filled { border-color: transparent; }
  .sel-dot-mood svg { width: 22px; height: 22px; }

  .sel-dot-mood .g {
    font-family: 'Special Elite', monospace;
    font-size: 18px;
    line-height: 1;
  }

  .sel-name {
    font-family: 'Literata', serif;
    font-size: 10px;
    color: var(--text-faint);
  }

  .sel-item.active .sel-name { color: var(--text-dim); }

  .paper-selector {
    background: var(--paper);
    border-radius: 12px;
    padding: 28px;
    margin-top: 16px;
  }

  .paper-selector h3 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 15px;
    color: var(--ink-black);
    margin-bottom: 24px;
    text-align: center;
  }

  .paper-selector .sel-dot-mood { border-color: #B0A898; }
  .paper-selector .sel-dot-mood svg { stroke: var(--ink-black); }
  .paper-selector .sel-dot-mood .g { color: var(--ink-black); }
  .paper-selector .sel-name { color: var(--ink-light); }
  .paper-selector .sel-item.active .sel-name { color: var(--ink-black); }
</style>

<h2>Dry Nib — Wider</h2>
<p class="subtitle">Fattened nib with more shoulder, side by side with the original</p>

<div class="compare">
  <div class="compare-item">
    <span class="label">Before</span>
    <div class="nib-large">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20l-3-8c1-3 2-5 3-8 1 3 2 5 3 8l-3 8z"/>
        <line x1="12" y1="20" x2="12" y2="14"/>
        <circle cx="12" cy="12" r="1" fill="none" stroke-width="1"/>
      </svg>
    </div>
  </div>
  <div class="compare-item">
    <span class="arrow">→</span>
  </div>
  <div class="compare-item">
    <span class="label">After</span>
    <div class="nib-large">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- wider nib: broader shoulders, more taper -->
        <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
        <!-- slit -->
        <line x1="12" y1="20" x2="12" y2="14.5"/>
        <!-- breather hole, slightly larger -->
        <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
      </svg>
    </div>
  </div>
</div>

<!-- At multiple sizes -->
<div class="section-label">At selector sizes</div>
<div class="sizes-row">
  <div class="size-item">
    <div class="sel-dot" style="width: 36px; height: 36px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
        <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
        <line x1="12" y1="20" x2="12" y2="14.5"/>
        <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
      </svg>
    </div>
    <span class="size-label">36px</span>
  </div>
  <div class="size-item">
    <div class="sel-dot" style="width: 44px; height: 44px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;">
        <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
        <line x1="12" y1="20" x2="12" y2="14.5"/>
        <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
      </svg>
    </div>
    <span class="size-label">44px (selector)</span>
  </div>
  <div class="size-item">
    <div class="sel-dot" style="width: 56px; height: 56px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;">
        <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
        <line x1="12" y1="20" x2="12" y2="14.5"/>
        <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
      </svg>
    </div>
    <span class="size-label">56px</span>
  </div>
</div>

<!-- FULL SET -->
<div class="section-label">Complete Set with Wider Nib</div>

<div class="full-selector">
  <h3>How did the writing feel?</h3>
  <div class="sel-strip">
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #7A5C50;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
          <line x1="12" y1="20" x2="12" y2="14.5"/>
          <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
        </svg>
      </div>
      <span class="sel-name">Dry</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #8A8070;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8DFD0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 16c0 0 1 3 7 3s7-3 7-3c0 0 1-4-1-7s-4-4-6-4-4 1-6 4-1 7-1 7z"/>
          <path d="M9 12l2 1.5 3-1" opacity="0.5" stroke-width="1"/>
        </svg>
      </div>
      <span class="sel-name">Grinding</span>
    </div>
    <div class="sel-item active">
      <div class="sel-dot-mood filled" style="background: #A09060;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V11"/>
          <path d="M12 14c-3-1-5-4-4-7 3 0 5 3 4 7z"/>
          <path d="M12 11c3-1 5-4 4-7-3 0-5 3-4 7z"/>
        </svg>
      </div>
      <span class="sel-name">Steady</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #C4956A;"><span class="g">∞</span></div>
      <span class="sel-name">Flow</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #C4956A;"><span class="g">✦</span></div>
      <span class="sel-name">Breakthrough</span>
    </div>
  </div>
</div>

<div class="paper-selector">
  <h3>On paper surface</h3>
  <div class="sel-strip">
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #B0A898;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2A2218" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20l-4.5-7.5c.5-2.5 2-5.5 4.5-8.5 2.5 3 4 6 4.5 8.5L12 20z"/>
          <line x1="12" y1="20" x2="12" y2="14.5"/>
          <circle cx="12" cy="12.5" r="1.2" fill="none" stroke-width="1"/>
        </svg>
      </div>
      <span class="sel-name">Dry</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #B0A898;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2A2218" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 16c0 0 1 3 7 3s7-3 7-3c0 0 1-4-1-7s-4-4-6-4-4 1-6 4-1 7-1 7z"/>
          <path d="M9 12l2 1.5 3-1" opacity="0.5" stroke-width="1"/>
        </svg>
      </div>
      <span class="sel-name">Grinding</span>
    </div>
    <div class="sel-item active">
      <div class="sel-dot-mood filled" style="background: #A09060;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V11"/>
          <path d="M12 14c-3-1-5-4-4-7 3 0 5 3 4 7z"/>
          <path d="M12 11c3-1 5-4 4-7-3 0-5 3-4 7z"/>
        </svg>
      </div>
      <span class="sel-name">Steady</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #B0A898;"><span class="g" style="color: #2A2218;">∞</span></div>
      <span class="sel-name">Flow</span>
    </div>
    <div class="sel-item">
      <div class="sel-dot-mood" style="border-color: #B0A898;"><span class="g" style="color: #2A2218;">✦</span></div>
      <span class="sel-name">Breakthrough</span>
    </div>
  </div>
</div>
